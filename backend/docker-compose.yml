version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quantum-resilient-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: quantum_resilient_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d quantum_resilient_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: